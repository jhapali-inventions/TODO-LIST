<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        .list-group-item {
            background-color: #e7f3ff;
        }
        .footer-text {
            text-align: center;
            color: lightgray;
            margin-top: 20px;
        }
        /* Dragging styles */
        .dragging {
            opacity: 0.5;
        }
        .drag-hint {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 8px;
        }
        /* Placeholder shown while dragging */
        .placeholder {
            background: rgba(0,0,0,0.02);
            border: 2px dashed #b7c7d9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-style: italic;
        }
        /* Allow immediate taps on controls and remove tap highlight */
        .list-group-item button,
        .list-group-item input {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Todo List</h1>
        <p class="text-center drag-hint">Tip: Drag tasks to reorder them. Order is saved automatically.</p>
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task">
            <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
        </div>
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-danger" id="deleteAllBtn">Delete All</button>
            <button class="btn btn-warning" id="undoAllBtn" style="display: none;">Undo</button>
        </div>
        <ul class="list-group" id="taskList"></ul>
    </div>

    <p class="footer-text">Aayush Adk</p>

    <script>
        const taskList = document.getElementById('taskList');
        const undoAllBtn = document.getElementById('undoAllBtn');
        const deletedTasks = [];
        let dragged = null; // currently dragged list item
        let placeholder = null;
        let touchDragTimer = null;

        // Load tasks from localStorage on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedTasks = JSON.parse(localStorage.getItem('tasks')) || [];
            savedTasks.forEach(({ text, completed }) => addTaskToList(text, completed));
        });

        document.getElementById('addTaskBtn').addEventListener('click', function() {
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();

            if (taskText === '') {
                alert('Please enter a task!');
                return;
            }

            addTaskToList(taskText, false);
            saveTasksToLocalStorage();
            taskInput.value = '';
            taskInput.focus();
        });

        document.getElementById('deleteAllBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to delete all tasks?')) {
                const tasks = Array.from(taskList.children).filter(n => !n.classList.contains('placeholder'));
                tasks.forEach((task, index) => {
                    const taskText = task.querySelector('span').textContent;
                    const completed = task.querySelector('span').classList.contains('completed');
                    deletedTasks.push({ text: taskText, completed, index });
                });
                taskList.innerHTML = '';
                updateUndoButtonVisibility();
                saveTasksToLocalStorage();
            }
        });

        undoAllBtn.addEventListener('click', function() {
            const tasksToRestore = [...deletedTasks];
            deletedTasks.length = 0; // Clear deletedTasks array
            tasksToRestore.sort((a, b) => a.index - b.index).forEach(({ text, completed, index }) => {
                addTaskToListAtIndex(text, completed, index);
            });
            updateUndoButtonVisibility();
            saveTasksToLocalStorage();
        });

        // Enable drag-over behavior on the list (desktop)
        taskList.addEventListener('dragover', function(e) {
            e.preventDefault();
            if (!dragged) return;
            const afterElement = getDragAfterElement(taskList, e.clientY);
            if (afterElement == null) {
                // append placeholder to end
                if (placeholder && placeholder.parentNode !== taskList) taskList.appendChild(placeholder);
                else if (!placeholder) {
                    taskList.appendChild(placeholder);
                }
            } else {
                taskList.insertBefore(placeholder, afterElement);
            }
        });

        taskList.addEventListener('drop', function(e) {
            e.preventDefault();
            finishDrag();
        });

        // Mobile touch support: handle touchmove reordering with long-press start
        document.addEventListener('touchmove', function(e) {
            if (!dragged) return;
            // prevent page scroll while dragging
            e.preventDefault();
            const touch = e.touches[0];
            const afterElement = getDragAfterElement(taskList, touch.clientY);
            if (afterElement == null) {
                if (placeholder && placeholder.parentNode !== taskList) taskList.appendChild(placeholder);
                else if (!placeholder) taskList.appendChild(placeholder);
            } else {
                taskList.insertBefore(placeholder, afterElement);
            }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            // If a long-press timer was running but no drag started, cancel it (it was a tap)
            if (touchDragTimer) {
                clearTimeout(touchDragTimer);
                touchDragTimer = null;
                return; // allow tap to proceed
            }
            if (!dragged) return;
            finishDrag();
        });

        function createPlaceholder(height) {
            const ph = document.createElement('li');
            ph.className = 'list-group-item placeholder';
            ph.style.height = (height || 48) + 'px';
            ph.textContent = 'Drop here';
            return ph;
        }

        function startDrag(item) {
            if (dragged) return;
            dragged = item;
            // create placeholder and hide original
            placeholder = createPlaceholder(item.offsetHeight);
            item.parentNode.insertBefore(placeholder, item.nextSibling);
            // small timeout so CSS transition doesn't glitch
            setTimeout(() => { item.style.display = 'none'; }, 0);
        }

        function finishDrag() {
            if (!dragged) return;
            // show original and replace placeholder
            dragged.style.display = '';
            if (placeholder && placeholder.parentNode) {
                placeholder.parentNode.insertBefore(dragged, placeholder);
                placeholder.parentNode.removeChild(placeholder);
            }
            placeholder = null;
            dragged.classList.remove('dragging');
            dragged = null;
            document.body.style.overflow = '';
            saveTasksToLocalStorage();
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.list-group-item:not(.dragging):not(.placeholder)')];
            let closest = { offset: Number.NEGATIVE_INFINITY, element: null };
            for (const child of draggableElements) {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    closest = { offset, element: child };
                }
            }
            return closest.element;
        }

        function addTaskToList(taskText, isCompleted) {
            const listItem = document.createElement('li');
            listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
            listItem.draggable = true;

            const taskSpan = document.createElement('span');
            taskSpan.textContent = taskText;
            if (isCompleted) {
                taskSpan.classList.add('completed');
            }
            listItem.appendChild(taskSpan);

            const controls = document.createElement('div');

            const toggleBtn = document.createElement('button');
            toggleBtn.className = isCompleted ? 'btn btn-sm btn-secondary me-2' : 'btn btn-sm btn-success me-2';
            toggleBtn.textContent = isCompleted ? 'Undo' : 'Complete';
            toggleBtn.addEventListener('click', function() {
                taskSpan.classList.toggle('completed');
                if (taskSpan.classList.contains('completed')) {
                    toggleBtn.textContent = 'Undo';
                    toggleBtn.classList.replace('btn-success', 'btn-secondary');
                } else {
                    toggleBtn.textContent = 'Complete';
                    toggleBtn.classList.replace('btn-secondary', 'btn-success');
                }
                saveTasksToLocalStorage();
            });
            controls.appendChild(toggleBtn);

            const editBtn = document.createElement('button');
            editBtn.className = 'btn btn-sm btn-warning me-2';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', function() {
                const newTask = prompt('Edit task:', taskSpan.textContent);
                if (newTask !== null && newTask.trim() !== '') {
                    taskSpan.textContent = newTask.trim();
                    saveTasksToLocalStorage();
                }
            });
            controls.appendChild(editBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-sm btn-danger';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', function() {
                const index = Array.from(taskList.children).filter(n => !n.classList.contains('placeholder')).indexOf(listItem);
                deletedTasks.push({ text: taskSpan.textContent, completed: taskSpan.classList.contains('completed'), index });
                taskList.removeChild(listItem);
                updateUndoButtonVisibility();
                saveTasksToLocalStorage();
            });
            controls.appendChild(deleteBtn);

            listItem.appendChild(controls);

            // Drag handlers (desktop)
            listItem.addEventListener('dragstart', function(e) {
                listItem.classList.add('dragging');
                startDrag(listItem);
                try { e.dataTransfer.setData('text/plain', ''); } catch (err) { /* IE fallback */ }
            });

            listItem.addEventListener('dragend', function() {
                listItem.classList.remove('dragging');
                finishDrag();
            });

            // Touch handlers for mobile with long-press start to avoid stealing taps on buttons
            listItem.addEventListener('touchstart', function(e) {
                const touchTarget = e.target;
                // If the user touched a control (button/input), do not start dragging so the control can receive the touch
                if (touchTarget.closest && (touchTarget.closest('button') || touchTarget.closest('input'))) {
                    return;
                }
                // Start a short timer; if it completes, begin dragging. Short taps will cancel this.
                touchDragTimer = setTimeout(() => {
                    touchDragTimer = null;
                    listItem.classList.add('dragging');
                    startDrag(listItem);
                    // prevent page from scrolling while dragging
                    document.body.style.overflow = 'hidden';
                }, 180);
            }, { passive: true });

            listItem.addEventListener('touchend', function(e) {
                if (touchDragTimer) {
                    clearTimeout(touchDragTimer);
                    touchDragTimer = null;
                    return; // a tap; let it proceed (e.g., button handlers)
                }
                // If we were dragging, finish
                if (listItem.classList.contains('dragging')) {
                    listItem.classList.remove('dragging');
                    finishDrag();
                }
            });

            taskList.appendChild(listItem);
        }

        function addTaskToListAtIndex(taskText, isCompleted, index) {
            const listItem = document.createElement('li');
            listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
            listItem.draggable = true;

            const taskSpan = document.createElement('span');
            taskSpan.textContent = taskText;
            if (isCompleted) {
                taskSpan.classList.add('completed');
            }
            listItem.appendChild(taskSpan);

            const controls = document.createElement('div');

            const toggleBtn = document.createElement('button');
            toggleBtn.className = isCompleted ? 'btn btn-sm btn-secondary me-2' : 'btn btn-sm btn-success me-2';
            toggleBtn.textContent = isCompleted ? 'Undo' : 'Complete';
            toggleBtn.addEventListener('click', function() {
                taskSpan.classList.toggle('completed');
                if (taskSpan.classList.contains('completed')) {
                    toggleBtn.textContent = 'Undo';
                    toggleBtn.classList.replace('btn-success', 'btn-secondary');
                } else {
                    toggleBtn.textContent = 'Complete';
                    toggleBtn.classList.replace('btn-secondary', 'btn-success');
                }
                saveTasksToLocalStorage();
            });
            controls.appendChild(toggleBtn);

            const editBtn = document.createElement('button');
            editBtn.className = 'btn btn-sm btn-warning me-2';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', function() {
                const newTask = prompt('Edit task:', taskSpan.textContent);
                if (newTask !== null && newTask.trim() !== '') {
                    taskSpan.textContent = newTask.trim();
                    saveTasksToLocalStorage();
                }
            });
            controls.appendChild(editBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-sm btn-danger';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', function() {
                const currentIndex = Array.from(taskList.children).filter(n => !n.classList.contains('placeholder')).indexOf(listItem);
                deletedTasks.push({ text: taskSpan.textContent, completed: taskSpan.classList.contains('completed'), index: currentIndex });
                taskList.removeChild(listItem);
                updateUndoButtonVisibility();
                saveTasksToLocalStorage();
            });
            controls.appendChild(deleteBtn);

            listItem.appendChild(controls);

            // Drag handlers (desktop)
            listItem.addEventListener('dragstart', function(e) {
                listItem.classList.add('dragging');
                startDrag(listItem);
                try { e.dataTransfer.setData('text/plain', ''); } catch (err) { /* IE fallback */ }
            });

            listItem.addEventListener('dragend', function() {
                listItem.classList.remove('dragging');
                finishDrag();
            });

            // Touch handlers for mobile with long-press
            listItem.addEventListener('touchstart', function(e) {
                const touchTarget = e.target;
                if (touchTarget.closest && (touchTarget.closest('button') || touchTarget.closest('input'))) {
                    return;
                }
                touchDragTimer = setTimeout(() => {
                    touchDragTimer = null;
                    listItem.classList.add('dragging');
                    startDrag(listItem);
                    document.body.style.overflow = 'hidden';
                }, 180);
            }, { passive: true });

            listItem.addEventListener('touchend', function(e) {
                if (touchDragTimer) {
                    clearTimeout(touchDragTimer);
                    touchDragTimer = null;
                    return;
                }
                if (listItem.classList.contains('dragging')) {
                    listItem.classList.remove('dragging');
                    finishDrag();
                }
            });

            if (index >= taskList.children.length) {
                taskList.appendChild(listItem);
            } else {
                taskList.insertBefore(listItem, taskList.children[index]);
            }
        }

        function updateUndoButtonVisibility() {
            undoAllBtn.style.display = deletedTasks.length > 0 ? 'inline-block' : 'none';
        }

        function saveTasksToLocalStorage() {
            const tasks = Array.from(taskList.children).filter(n => !n.classList.contains('placeholder')).map(task => {
                const text = task.querySelector('span').textContent;
                const completed = task.querySelector('span').classList.contains('completed');
                return { text, completed };
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
